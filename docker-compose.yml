services:
  hermes:
    build: .
    container_name: hermes-homelab
    restart: unless-stopped
    ports:
      - "7681:7681"
    volumes:
      - ${DATA_DIR:-./data}/workspace:/workspace
      - ${DATA_DIR:-./data}/hermes-config:/home/hermes/.hermes
      - ${DATA_DIR:-./data}/hermes-home:/home/hermes
    environment:
      - TTYD_USER=${TTYD_USER:-hermes}
      - TTYD_PASSWORD=${TTYD_PASSWORD:-changeme}
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - CHOWN
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
      - /run:size=64m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ulimits:
      nproc: 512
      nofile:
        soft: 65536
        hard: 65536
    networks:
      hermes-net:

networks:
  hermes-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
