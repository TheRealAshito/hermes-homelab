services:
  hermes:
    build: .
    container_name: hermes-homelab
    restart: unless-stopped
    ports:
      - "7681:7681"
    volumes:
      - hermes-workspace:/workspace
      - hermes-config:/home/hermes/.hermes
      - hermes-home:/home/hermes
    environment:
      - TTYD_USER=${TTYD_USER:-hermes}
      - TTYD_PASSWORD=${TTYD_PASSWORD:-changeme}
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - DAC_OVERRIDE                 # Root needs this to traverse hermes-owned dirs
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /run:size=64m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ulimits:
      nproc: 512
      nofile:
        soft: 65536
        hard: 65536
    networks:
      hermes-net:

networks:
  hermes-net:
    driver: bridge

volumes:
  hermes-workspace:
  hermes-config:
  hermes-home:
