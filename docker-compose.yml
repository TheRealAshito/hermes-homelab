services:
  hermes:
    build: .
    container_name: hermes-homelab
    restart: unless-stopped
    # Opt-in hardening: set HERMES_RUNTIME=runsc after installing gVisor
    # (see README "Sandboxing with gVisor"). Default runc = zero-step compat.
    runtime: ${HERMES_RUNTIME:-runc}
    ports:
      - "7681:7681"
    volumes:
      - ${DATA_DIR:-./data}/workspace:/workspace
      - ${DATA_DIR:-./data}/hermes-config:/home/hermes/.hermes
    environment:
      - TTYD_USER=${TTYD_USER:-hermes}
      - TTYD_PASSWORD=${TTYD_PASSWORD:-changeme}
      # Egress routing: empty = OPEN mode (default) — tools talk to the
      # internet directly (LAN stays blocked by the entrypoint firewall).
      # Set EGRESS_PROXY_URL in .env to route everything through the
      # default-deny allowlist proxy (egress-proxy/).
      - HTTP_PROXY=${EGRESS_PROXY_URL:-}
      - HTTPS_PROXY=${EGRESS_PROXY_URL:-}
      - http_proxy=${EGRESS_PROXY_URL:-}
      - https_proxy=${EGRESS_PROXY_URL:-}
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
      - EGRESS_PROXY_URL=${EGRESS_PROXY_URL:-}
      - EGRESS_MODE=${EGRESS_MODE:-}
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - CHOWN
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
      - /run:size=64m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ulimits:
      nproc: 512
      nofile:
        soft: 65536
        hard: 65536
    # Protect the host (e.g. a media server) from runaway agent workloads.
    mem_limit: ${HERMES_MEM_LIMIT:-2g}
    cpus: ${HERMES_CPUS:-2.0}
    depends_on:
      - egress-proxy
    networks:
      - hermes-net

  egress-proxy:
    build: ./egress-proxy
    container_name: hermes-egress-proxy
    restart: unless-stopped
    volumes:
      # Seeded from egress-proxy/allowlist.default on first run
      # (egress-proxy/seed.sh). Empty file = deny ALL. Edit live.
      - ${DATA_DIR:-./data}/egress-allowlist.conf:/etc/egress/allowlist
    dns:
      - 1.1.1.1
      - 8.8.8.8
    mem_limit: 128m
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
